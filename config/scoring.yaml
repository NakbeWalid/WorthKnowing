# HYPOTHÈSES de mesure (valeurs initiales, à calibrer avec les personas synthétiques).
declared_drawdown_threshold_pct: {faible: 10, faible_modere: 15, modere: 25, eleve: 40, tres_eleve: 55}
rt:
  slope: 0.15            # pente de la logistique P(vendre | baisse)
  prior_sd: 15
  min_drawdown_pct: 3    # décisions prises en baisse d'au moins 3 %
  stimulus_weight: 0.3   # poids des décisions prises avec stimulus
  scale_max_pct: 60      # baisse correspondant à un score de 100
  classes: [[12, faible], [20, faible_modere], [32, modere], [47, eleve], [999, tres_eleve]]
la: {severe_drawdown_pct: 15}
imp: {fast_ms: 3000, base_reading_ms: 4000, ms_per_char: 40}
disp: {gain_pct: 10, loss_pct: -10}
recognition_weight: 0.5
interval: 0.80
confidence: {n_full: 6, preliminary_below: 0.60}
gap: {rt_points: 12, other_points: 15, undeclared_points: 40}
trade_observation_weight: 0.5
max_points_per_event: 3
