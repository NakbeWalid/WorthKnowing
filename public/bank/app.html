<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8"><script>try{document.documentElement.dataset.theme=localStorage.getItem('wk-theme')==='dark'?'dark':'light'}catch(e){}</script><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Boréal Courtage — Mon compte</title>
  <link rel="stylesheet" href="/shared/ui.css">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body class="app boreal">
<header class="nav">
  <span id="navLogo"></span>
  <nav class="nav-links" role="tablist" aria-label="Sections">
    <button role="tab" data-view="portfolio" aria-selected="true">Portefeuille</button>
    <button role="tab" data-view="activity" aria-selected="false">Activité<span class="count" id="activityCount"></span></button>
  </nav>
  <span class="spacer"></span>
  <span class="pill outline demo-pill" title="Capital fictif, aucun ordre réel, aucun conseil financier">Démo · capital fictif</span>
  <span id="wkPill"></span>
  <div class="user-chip"><span id="hello"></span><div class="avatar" id="avatar">·</div></div>
  <button class="btn soft icon-only" id="logout" title="Fermer la session" aria-label="Fermer la session"></button>
</header>

<main class="shell">
  <div id="notices"></div>

  <!-- ===================================================== Portefeuille -->
  <section id="view-portfolio" class="view pf">
    <div class="widget brand hero" style="grid-area:hero">
      <div class="hero-side">
        <div>
          <div class="kpi-label">Valeur totale du compte</div>
          <div class="kpi xl" id="total">—</div>
          <div class="row wrap" id="gain" style="margin-top:10px"></div>
        </div>
        <div class="hero-stats">
          <div class="stat-tile"><div class="kpi-label">Liquidités</div><div class="kpi" id="cash">—</div></div>
          <div class="stat-tile"><div class="kpi-label">Investi</div><div class="kpi" id="invested">—</div></div>
        </div>
        <p class="tiny faint" id="asOf"></p>
      </div>
      <div class="chart-box fill"><canvas id="valueChart" aria-label="Valeur du compte dans le temps"></canvas>
        <div class="empty-chart hidden" id="valueEmpty"><span>Votre courbe apparaîtra après votre premier ordre.</span></div></div>
    </div>

    <div class="widget" style="grid-area:pos">
      <div class="widget-head"><h3>Positions</h3><span class="pill outline" id="allocCount"></span></div>
      <div class="widget-body scroll list" id="positions"></div>
    </div>

    <div class="widget" style="grid-area:alloc">
      <div class="widget-head"><h3>Répartition</h3></div>
      <div class="chart-box donut-box"><canvas id="allocChart"></canvas><div class="donut-center"><b id="allocCash">—</b><span class="tiny faint">liquidités</span></div></div>
      <div class="widget-body scroll alloc-legend" id="allocLegend"></div>
    </div>

    <div class="widget night" id="wkWidget" style="grid-area:wk"></div>

    <!-- Ticket d'ordre -->
    <form class="widget ticket" id="ticket" novalidate style="grid-area:ticket">
      <div class="widget-head"><h3>Passer un ordre</h3><span class="tiny faint" id="cashHint"></span></div>
      <div class="segmented side-switch">
        <input type="radio" name="side" id="buy" value="buy" checked><label for="buy">Acheter</label>
        <input type="radio" name="side" id="sell" value="sell"><label for="sell">Vendre</label>
      </div>
      <div class="field"><label for="ticker">Actif</label><select id="ticker"></select></div>
      <div class="quote" id="quote"><div class="skeleton" style="height:100%"></div></div>
      <div class="field">
        <label for="amount">Montant</label>
        <div class="money-input"><input id="amount" type="number" min="1" step="any" inputmode="decimal" value="5000" required><span>$</span></div>
        <div class="chips" id="amountChips">
          <button type="button" class="chip" data-amt="1000">1 000</button>
          <button type="button" class="chip on" data-amt="5000">5 000</button>
          <button type="button" class="chip" data-amt="10000">10 000</button>
          <button type="button" class="chip" data-amt="max">Max</button>
        </div>
      </div>
      <div class="ticket-row">
        <div class="field"><label for="date">Date de marché simulée</label><input id="date" type="date"></div>
        <div class="field"><label for="note">Note (facultatif)</label><input id="note" maxlength="280" placeholder="Pourquoi cet ordre ?"></div>
      </div>
      <div class="error" id="ticketError" role="alert"></div>
      <button class="btn primary lg block" id="orderButton">Vérifier l’ordre</button>
    </form>
  </section>

  <!-- ===================================================== Activité -->
  <section id="view-activity" class="view act hidden">
    <div class="widget" style="grid-area:list">
      <div class="widget-head"><h3>Mes ordres</h3>
        <div class="chips" id="historyFilter">
          <button class="chip on" data-filter="all">Tous</button><button class="chip" data-filter="buy">Achats</button>
          <button class="chip" data-filter="sell">Ventes</button><button class="chip" data-filter="flag" title="Règle outrepassée">Écarts</button>
        </div></div>
      <div class="widget-body scroll list" id="history"></div>
    </div>

    <div class="widget" style="grid-area:chart">
      <div class="widget-head"><h3>Dérive WorthKnowing, ordre après ordre</h3>
        <div class="legend"><span><i style="background:var(--plum)"></i>Dérive</span><span><i style="background:var(--red)"></i>Règle outrepassée</span></div></div>
      <div class="act-top">
        <div class="act-stats" id="activityStats"></div>
        <div class="chart-box fill"><canvas id="driftChart"></canvas><div class="empty-chart light hidden" id="driftEmpty"><span></span></div></div>
      </div>
    </div>

    <div class="widget order-detail" id="orderDetail" style="grid-area:detail"></div>
  </section>
</main>

<script src="/shared/vendor/chartjs/chart.umd.js"></script>
<script src="/shared/ui.js"></script>
<script src="/js/common.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
