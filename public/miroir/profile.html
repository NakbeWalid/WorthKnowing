<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Miroir — Mon profil</title>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<header class="top">
  <a class="brand" data-word="Miroir" href="/profile.html">Miroir</a>
  <span class="muted" id="hello"></span><div class="spacer"></div>
  <button class="link" onclick="session.clear()">Déconnexion</button>
</header>
<main>
  <div id="top"></div>
  <div class="grid side">
    <div>
      <div class="card">
        <h2>Score de dérive</h2>
        <div class="drift"><span class="score num" id="driftScore">0</span><span class="muted">sur 100</span></div>
        <div class="gauge"><i id="driftNeedle"></i><b id="driftLimit"></b></div>
        <p class="small muted" id="driftText" style="margin:0"></p>
      </div>
      <div class="card">
        <h2>Compte de courtage</h2>
        <div id="link"></div>
      </div>
    </div>
    <div>
      <div class="card">
        <h2>Mon profil</h2>
        <div id="params"></div>
        <p class="small muted" id="evaluated"></p>
        <button onclick="location.href='/onboarding.html'">Refaire une évaluation</button>
      </div>
      <div class="card">
        <h2>Mes règles</h2>
        <div id="rules"></div>
      </div>
      <div class="card">
        <h2>Mes ordres analysés</h2>
        <div id="history"></div>
      </div>
    </div>
  </div>
  <p class="disclaimer">Simulation uniquement : aucune transaction réelle, aucun conseil financier.</p>
</main>
<script src="/js/common.js"></script>
<script src="/js/investigation.js"></script>
<script src="/js/profile.js"></script>
</body>
</html>
