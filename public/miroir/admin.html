<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WorthKnowing — Administration</title>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<header class="top">
  <a class="brand" href="/admin.html">WorthKnowing</a> <span class="badge grey">Admin</span>
  <span class="badge" id="live">● en direct</span><div class="spacer"></div>
  <button class="link" onclick="session.clear()">Déconnexion</button>
</header>
<main>
  <div class="grid" style="grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr)">
    <div class="card">
      <h2>Personas</h2>
      <table>
        <thead><tr><th>Nom</th><th>Statut</th><th class="right">Dérive</th><th class="right">Règles</th><th class="right">Ordres</th></tr></thead>
        <tbody id="users"></tbody>
      </table>
    </div>
    <div class="card">
      <h2>Activité en temps réel</h2>
      <div class="feed" id="feed"><p class="muted">En attente d’événements…</p></div>
    </div>
  </div>
  <div id="detail"></div>
</main>
<script src="/js/common.js"></script>
<script src="/js/investigation.js"></script>
<script src="/js/admin.js"></script>
</body>
</html>
