<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WorthKnowing — Administration</title>
  <link rel="stylesheet" href="/shared/ui.css">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body class="app wk">
<header class="nav"></header>
<main class="shell">
  <section class="view adm">
    <div class="adm-kpis stagger" id="kpis" style="grid-area:kpis"></div>

    <div class="widget" style="grid-area:gallery">
      <div class="widget-head"><h3>Personas, regroupés par caractère</h3><div class="chips" id="archFilter"></div></div>
      <div class="widget-body scroll" id="gallery"></div>
    </div>

    <div class="widget" style="grid-area:feed">
      <div class="widget-head"><h3>Activité des agents, en direct</h3><span class="pill red" id="live"><span class="dot live"></span>en direct</span></div>
      <div class="widget-body scroll" id="feed"><div class="empty-state" id="feedEmpty"></div></div>
    </div>
  </section>
</main>
<script src="/shared/vendor/chartjs/chart.umd.js"></script>
<script src="/shared/ui.js"></script>
<script src="/js/common.js"></script>
<script src="/js/investigation.js"></script>
<script src="/js/admin.js"></script>
</body>
</html>
